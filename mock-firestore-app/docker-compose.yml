services:
  firestore:
    image: google/cloud-sdk:emulators
    platform: linux/amd64
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://gcs:4443"]
    ports:
      - "4443:4443"

  api:
    build: ./api
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCP_PROJECT: mock-project
      BUCKET: mock-files
      COLLECTION: jobs
    depends_on:
      firestore:
        condition: service_healthy
      gcs:
        condition: service_started

  worker:
    build: ./worker
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCP_PROJECT: mock-project
      BUCKET: mock-files
      COLLECTION: jobs
      POLL_MS: "1500"
    depends_on:
      firestore:
        condition: service_healthy
      gcs:
        condition: service_started
