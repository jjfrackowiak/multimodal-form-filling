services:
  firestore:
    image: google/cloud-sdk:emulators
    platform: linux/amd64
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://gcs:4443"]
    ports:
      - "4443:4443"

  api:
    build: ./api
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCP_PROJECT: mock-project
      BUCKET: mock-files
      COLLECTION: jobs
      PREPARE_URL: http://fn-prepare:8080/prepare
    depends_on:
      firestore:
        condition: service_healthy
      gcs:
        condition: service_started
      fn-prepare:
        condition: service_started

  fn-prepare:
    build: ./fn-prepare
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCP_PROJECT: mock-project
      COLLECTION: jobs
      CV_URL: http://cv:8080/process
    depends_on:
      firestore:
        condition: service_healthy
      gcs:
        condition: service_started
      cv:
        condition: service_started

  cv:
    build: ./services/cv
    ports:
      - "8083:8080"
    environment:
      PORT: "8080"
      FIRESTORE_EMULATOR_HOST: firestore:8080
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCP_PROJECT: mock-project
      COLLECTION: jobs
    depends_on:
      firestore:
        condition: service_healthy
      gcs:
        condition: service_started

  email:
    build: ./services/email
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"

  editor:
    build: ./services/editor
    ports:
      - "8085:8080"
    environment:
      PORT: "8080"
