[project]
name = "email-service"
version = "0.1.0"
description = "Empty skeleton (B0). Owned by a later branch: mailbox intake, IntakeVerdict, request acceptance and delivery (Part 1)."
requires-python = ">=3.11"
dependencies = [
    "mff-contracts",
    "mff-docmodel",
    "mff-store",
    "mff-applier",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
mff-contracts = { workspace = true }
mff-docmodel = { workspace = true }
mff-store = { workspace = true }
mff-applier = { workspace = true }
