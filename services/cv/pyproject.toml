[project]
name = "cv"
version = "1.0.0"
description = "Cloud Run image-understanding tool (req 13). Checklist + gs:// photos → inventory."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
]

[project.scripts]
cv = "cv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv"]
