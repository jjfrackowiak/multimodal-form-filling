[project]
name = "editor-service"
version = "0.1.0"
description = "Empty skeleton (B0). Owned by a later branch: the AI editor — orchestrator, runner, agents, slicing, and compilation (Part 2)."
requires-python = ">=3.11"
dependencies = ["mff-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_service"]

[tool.uv.sources]
mff-contracts = { workspace = true }
