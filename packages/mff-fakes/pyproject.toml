[project]
name = "mff-fakes"
version = "0.1.0"
description = "FakeLlm — the ADK test double. A BaseLlm that returns scripted responses and records what it was asked, so B2/B6/B7/B8 never touch a live model in CI."
requires-python = ">=3.11"
dependencies = ["mff-contracts", "google-adk>=2.8", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_fakes"]

[tool.uv.sources]
mff-contracts = { workspace = true }
