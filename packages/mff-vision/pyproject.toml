[project]
name = "mff-vision"
version = "0.1.0"
description = "Client contract for image understanding (req 13), with a deterministic stand-in."
requires-python = ">=3.11"
dependencies = ["mff-contracts", "pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27", "google-auth>=2.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_vision"]

[tool.uv.sources]
mff-contracts = { workspace = true }
