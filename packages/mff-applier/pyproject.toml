[project]
name = "mff-applier"
version = "0.1.0"
description = "Empty skeleton (B0). Owned by a later branch: applying DraftOps and compiling a FormDraft or annotated Node tree into a real .docx (RenderMap, CompiledForm)."
requires-python = ">=3.11"
dependencies = ["mff-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_applier"]

[tool.uv.sources]
mff-contracts = { workspace = true }
