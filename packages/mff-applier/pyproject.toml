[project]
name = "mff-applier"
version = "0.1.0"
description = "Pure DraftOp/SliceReport applier (req 14, req 15): (Artifact, SliceReport) -> Artifact."
requires-python = ">=3.11"
dependencies = ["mff-contracts", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_applier"]

[tool.uv.sources]
mff-contracts = { workspace = true }
