[project]
name = "mff-store"
version = "0.1.0"
description = "Empty skeleton (B0). Owned by a later branch: implementations of the ArtifactRepository, JobRepository, RequestRepository and BlobStore protocols."
requires-python = ">=3.11"
dependencies = ["mff-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_store"]

[tool.uv.sources]
mff-contracts = { workspace = true }
