[project]
name = "mff-manifest"
version = "0.1.0"
description = "Empty skeleton (B0). Owned by a later branch: parsing a raw manifest into Requirement[] (reqs 4, 5)."
requires-python = ">=3.11"
dependencies = ["mff-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mff_manifest"]

[tool.uv.sources]
mff-contracts = { workspace = true }
