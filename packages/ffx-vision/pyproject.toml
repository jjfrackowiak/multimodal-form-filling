[project]
name = "ffx-vision"
version = "0.1.0"
description = "Client contract for image understanding (req 13), with a deterministic stand-in."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffx_vision"]
