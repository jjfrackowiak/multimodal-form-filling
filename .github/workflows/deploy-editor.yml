name: deploy-editor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/editor-service/**
      - docker/editor-service.Dockerfile
      - docker/cloudbuild-editor.yaml
      - infra/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-editor.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-terraform
  cancel-in-progress: false

env:
  PROJECT_ID: linen-badge-507111-r6
  REGION: europe-central2

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/19550183464/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@linen-badge-507111-r6.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build editor image
        id: image
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT_ID}/app/editor:${GITHUB_SHA}"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          gcloud builds submit \
            --region="$REGION" \
            --config docker/cloudbuild-editor.yaml \
            --gcs-source-staging-dir="gs://${PROJECT_ID}-build/source" \
            --gcs-log-dir="gs://${PROJECT_ID}-build/logs" \
            --substitutions=_IMAGE="$IMG" \
            .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: terraform apply
        id: tf
        working-directory: infra
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: |
          terraform init
          CV_IMG=$(terraform output -raw cv_image)
          terraform apply -auto-approve \
            -target=google_cloud_run_v2_service.editor[0] \
            -var="cv_image=${CV_IMG}" \
            -var="editor_image=${{ steps.image.outputs.img }}"
          echo "url=$(terraform output -raw editor_url)" >> "$GITHUB_OUTPUT"

      - name: GET /healthz
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: |
          ACCESS="$(gcloud auth print-access-token)"
          RESP="$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS}" \
            -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/github-deploy@${PROJECT_ID}.iam.gserviceaccount.com:generateIdToken" \
            -d "{\"audience\":\"${URL}\"}")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"${RESP}")"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/health"
