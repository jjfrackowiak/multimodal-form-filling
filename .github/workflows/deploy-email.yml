name: deploy-email

on:
  # Mailbox vars live in gitignored terraform.tfvars (or GH secrets later).
  # A push-triggered apply without IMAP would wipe the poller or destroy the service.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-terraform
  cancel-in-progress: false

env:
  PROJECT_ID: linen-badge-507111-r6
  REGION: europe-central2

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/gcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/19550183464/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@linen-badge-507111-r6.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build email image
        id: image
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT_ID}/app/email:${GITHUB_SHA}"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          gcloud builds submit \
            --region="$REGION" \
            --config docker/cloudbuild-email.yaml \
            --gcs-source-staging-dir="gs://${PROJECT_ID}-build/source" \
            --gcs-log-dir="gs://${PROJECT_ID}-build/logs" \
            --substitutions=_IMAGE="$IMG" \
            .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: terraform apply
        id: tf
        working-directory: infra
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          TF_VAR_imap_host: ${{ secrets.IMAP_HOST }}
          TF_VAR_imap_port: ${{ secrets.IMAP_PORT }}
          TF_VAR_imap_folder: ${{ secrets.IMAP_FOLDER }}
          TF_VAR_imap_user: ${{ secrets.IMAP_USER }}
          TF_VAR_imap_password: ${{ secrets.IMAP_PASSWORD }}
          TF_VAR_imap_use_tls: ${{ secrets.IMAP_USE_TLS }}
          TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
          TF_VAR_smtp_port: ${{ secrets.SMTP_PORT }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          TF_VAR_smtp_use_tls: ${{ secrets.SMTP_USE_TLS }}
          TF_VAR_mail_from: ${{ secrets.MAIL_FROM }}
          TF_VAR_allowed_senders: ${{ secrets.ALLOWED_SENDERS }}
        run: |
          terraform init
          CV_IMG=$(terraform output -raw cv_image)
          EDITOR_IMG=$(terraform output -raw editor_image)
          if [ -z "$CV_IMG" ] || [ -z "$EDITOR_IMG" ]; then
            echo "refusing apply: cv_image/editor_image missing from state" >&2
            exit 1
          fi
          terraform apply -auto-approve \
            -var="cv_image=${CV_IMG}" \
            -var="editor_image=${EDITOR_IMG}" \
            -var="email_image=${{ steps.image.outputs.img }}"
          echo "url=$(terraform output -raw email_url)" >> "$GITHUB_OUTPUT"

      - name: GET /healthz
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: |
          ACCESS="$(gcloud auth print-access-token)"
          RESP="$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS}" \
            -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/github-deploy@${PROJECT_ID}.iam.gserviceaccount.com:generateIdToken" \
            -d "{\"audience\":\"${URL}\"}")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"${RESP}")"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/health"
