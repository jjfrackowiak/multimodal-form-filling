# Full local stack: the three application images plus the dev infra they need.
#
#   docker compose up -d
#   python scripts/verify_mailbox.py
#
# GreenMail — not Mailpit — is defined once in docker/compose.dev.yaml and pulled in below
# via `include` rather than duplicated here. Mailpit is SMTP-only for receiving and speaks
# no IMAP, so the inbound poller (B4) cannot be developed against it. B12 may extend that
# file with Firestore/GCS emulators; this file picks those up automatically through the
# include — nothing to edit here when it does.
#
# GCP blocks outbound SMTP port 25 permanently; 587 and 465 are unrestricted. Nothing in
# this stack, or in .env.example, references 25 — on purpose. A fallback to 25 works
# locally against GreenMail and fails silently the moment this ships to Cloud Run, which is
# the most common way a mail integration dies there.
#
# email-service and editor-service are still empty skeletons (B0) — their images build and
# their healthchecks are wired for when B3/B4/B5/B13 and B8 land the app/`/healthz` route
# each owns. Until then `docker compose up` brings GreenMail and vision-stub to healthy;
# the other two build but have no entrypoint to run yet. See docker/README.md.

include:
  - docker/compose.dev.yaml

x-healthz-probe: &healthz-probe
  test:
    - CMD
    - python
    - -c
    - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  vision-stub:
    build:
      context: .
      dockerfile: docker/vision-stub.Dockerfile
    container_name: mff-vision-stub
    ports:
      - "8002:8000"
    healthcheck: *healthz-probe
    restart: unless-stopped

  editor-service:
    build:
      context: .
      dockerfile: docker/editor-service.Dockerfile
    container_name: mff-editor-service
    ports:
      - "8001:8000"
    environment:
      # Read from the host environment at `docker compose up` time — never baked into
      # the image. The real model factory uses Vertex AI and ADC, not an API key.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_GENAI_USE_ENTERPRISE: "true"
      EDITOR_MODEL_ID: ${EDITOR_MODEL_ID:-gemini-2.5-flash}
      VISION_SERVICE_URL: http://vision-stub:8000
    volumes:
      - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro
    depends_on:
      vision-stub:
        condition: service_healthy
    healthcheck: *healthz-probe
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: docker/email-service.Dockerfile
    container_name: mff-email-service
    ports:
      - "8000:8000"
    environment:
      # GreenMail's own ports (docker/compose.dev.yaml), reached by compose service name
      # rather than localhost since this container is on the compose network. Never 25 —
      # see the file header.
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_USER: ${IMAP_USER:-forms@example.test}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-anything}
      IMAP_USE_TLS: "false"
      SMTP_HOST: greenmail
      SMTP_PORT: "3025"
      SMTP_USER: ${SMTP_USER:-forms@example.test}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-anything}
      SMTP_USE_TLS: "false"
      MAIL_FROM: ${MAIL_FROM:-forms@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Form Validation}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:-}
      MAX_JOBS_PER_SENDER_PER_HOUR: ${MAX_JOBS_PER_SENDER_PER_HOUR:-10}
      EDITOR_SERVICE_URL: http://editor-service:8000
      VISION_SERVICE_URL: http://vision-stub:8000
    depends_on:
      greenmail:
        condition: service_healthy
      editor-service:
        condition: service_healthy
    healthcheck: *healthz-probe
    restart: unless-stopped
