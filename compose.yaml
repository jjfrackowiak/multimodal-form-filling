# Full local stack: CV (real Vertex) + editor + email + GreenMail/emulators.
#
#   docker compose up -d
#   python scripts/verify_mailbox.py
#
# CV replaces vision-stub. Mount ADC so Vertex works locally.
# Editor calls CV at slice time (CV_URL). Email never talks to CV.

include:
  - docker/compose.dev.yaml

x-healthz-probe: &healthz-probe
  test:
    - CMD
    - python
    - -c
    - "import os,urllib.request,sys; p=os.environ.get('PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://localhost:{p}/healthz').status==200 else 1)"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  cv:
    build:
      context: .
      dockerfile: docker/cv.Dockerfile
    container_name: mff-cv
    ports:
      - "8002:8080"
    environment:
      PORT: "8080"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-linen-badge-507111-r6}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_APPLICATION_CREDENTIALS: /home/app/.config/gcloud/application_default_credentials.json
      STORAGE_EMULATOR_HOST: http://gcs:4443
    volumes:
      - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro
    depends_on:
      gcs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  editor-service:
    build:
      context: .
      dockerfile: docker/editor-service.Dockerfile
    container_name: mff-editor-service
    ports:
      - "8001:8080"
    environment:
      PORT: "8080"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-linen-badge-507111-r6}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_ENTERPRISE: "true"
      EDITOR_MODEL_ID: ${EDITOR_MODEL_ID:-gemini-2.5-flash}
      PARSER_MODEL_ID: ${PARSER_MODEL_ID:-gemma-4-26b-a4b-it-maas}
      CV_URL: http://cv:8080
      GOOGLE_APPLICATION_CREDENTIALS: /home/app/.config/gcloud/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro
    depends_on:
      cv:
        condition: service_healthy
    healthcheck: *healthz-probe
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: docker/email-service.Dockerfile
    container_name: mff-email-service
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
      IMAP_HOST: greenmail
      IMAP_PORT: "3143"
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_USER: ${IMAP_USER:-forms@example.test}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-anything}
      IMAP_USE_TLS: "false"
      SMTP_HOST: greenmail
      SMTP_PORT: "3025"
      SMTP_USER: ${SMTP_USER:-forms@example.test}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-anything}
      SMTP_USE_TLS: "false"
      MAIL_FROM: ${MAIL_FROM:-forms@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Form Validation}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:-}
      MAX_JOBS_PER_SENDER_PER_HOUR: ${MAX_JOBS_PER_SENDER_PER_HOUR:-10}
      EDITOR_SERVICE_URL: http://editor-service:8080
      FIRESTORE_EMULATOR_HOST: firestore:8090
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-mff-local}
      MFF_GCS_BUCKET: ${MFF_GCS_BUCKET:-mff-local}
    depends_on:
      greenmail:
        condition: service_healthy
      editor-service:
        condition: service_healthy
      firestore:
        condition: service_healthy
      gcs:
        condition: service_healthy
    healthcheck: *healthz-probe
    restart: unless-stopped
