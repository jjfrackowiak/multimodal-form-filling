[project]
name = "mff-workspace"
version = "0.0.0"
description = "Multimodal form filling — uv workspace root (virtual, no code of its own)."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    # fixtures/fleet-vehicle-return/check_output.py (the reference evaluator every
    # brief is told to run) imports docx directly. It is a standalone dev-time
    # script, not a package, so this is a workspace dev dependency rather than
    # something any single package should carry — mirrors pytest/ruff/mypy above.
    # Not a violation of the "mff_contracts depends on pydantic and nothing else" /
    # "python-docx must not appear in the editor" rules: those bind package source
    # under packages/ and services/, not this repo-root dev tooling group.
    "python-docx>=1.1",
    # Structural evals (B2's manifest live eval today; B6/B7's slice evals later) stay on
    # pydantic-evals even though agents are ADK — see CONTEXT.md, "Rules every branch
    # inherits". A dev-group dependency, same reasoning as python-docx above: it pins
    # pydantic-ai-slim, which must never reach a service image, so the banned-api rule on
    # `pydantic_evals.evaluators.LLMJudge` (below) is what actually keeps it honest, not
    # keeping the package itself out of dev tooling.
    "pydantic-evals>=0.1",
]

# ---------------------------------------------------------------------------
# ruff — one shared config, no per-package overrides
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "services"]
# Only packages/ and services/ are ours to lint/format in B0. docs/, fixtures/, and
# scripts/ predate this branch and are out of scope — never reformat them, even if `ruff`
# is accidentally invoked at the repo root instead of via `make check`. Markdown is
# excluded everywhere: ruff can reformat fenced ```python blocks in *.md, but READMEs
# outside our own new packages are not ours to rewrite.
extend-exclude = ["docs", "fixtures", "scripts", "multimodal-form-filling", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: X = Depends(...)`; B008 otherwise flags it
# as a mutable-default-style footgun, which it is not in FastAPI's calling convention.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Import-linter can only forbid a module, not a symbol inside one -- `pydantic_evals` as a
# whole is needed by every eval suite (Case, Dataset, Evaluator). This targets the one
# symbol the plan actually forbids. Note that `pydantic-evals` is a DEV-GROUP dependency
# only: it pins `pydantic-ai-slim`, which must never reach a service image. Agents are ADK.
"pydantic_evals.evaluators.LLMJudge".msg = "Evaluators here are structural, never LLM-as-judge. See the evals section of docs/app-implementation-plan.md."

[tool.ruff.lint.isort]
known-first-party = [
    "mff_contracts",
    "mff_vision",
    "mff_docmodel",
    "mff_manifest",
    "mff_applier",
    "mff_store",
    "mff_fakes",
    "email_service",
    "editor_service",
    "vision_stub",
    "cv",
]

# ---------------------------------------------------------------------------
# mypy --strict across the workspace
# ---------------------------------------------------------------------------
[tool.mypy]
# Invoked per package (see Makefile `typecheck`): each package's `src` and `tests` are
# type-checked in their own mypy run, so a `tests/test_x.py` basename shared by two
# packages (every skeleton has one) is never a "duplicate module" collision.
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "google.*",
    "google.cloud.*",
    "google.genai.*",
    "PIL.*",
    "factories",
    "intake_helpers",
    "golden",
    "conftest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml ships no inline types and lxml-stubs is a separate, unpinned package; python-docx
# (mff-docmodel's own dependency) already carries the same untyped dependency internally.
# Only mff-docmodel's tests reach for it directly, to manipulate word/document.xml for the
# byte-identical-body assertion (B1).
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# B12: google-cloud-storage ships no py.typed (unlike google-cloud-firestore, which does),
# so it is unresolved under mypy --strict regardless of import style.
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# B2: packages/mff-manifest/tests/live_extractor.py — used ONLY by the manual,
# env-flag-gated live eval (test_live_eval.py), never by the package itself or by any
# other test. `google-genai` is mff-manifest's `live-eval` OPTIONAL extra, never installed
# by `uv sync --all-packages`, so `google.genai` is unresolved in this environment by
# design. mypy still type-checks everything under tests/ (see the Makefile's `typecheck`
# target), so the import needs to resolve as `Any` even though the underlying package is
# absent here. The bare "google" entry is required alongside the dotted ones: with
# `google.genai` itself absent from disk, mypy's namespace-package resolution reports the
# gap against the "google" namespace it importantly did locate (via mff-store's
# google-cloud-* packages), not against "google.genai" — narrowing this to the dotted
# form alone leaves the original error in place. It does not widen what the existing
# `google.cloud.storage` override already covers: a bare, non-wildcard "google" entry
# matches only `import google` itself, and mff-store never imports the package that way.
module = ["google", "google.genai", "google.genai.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter — the highest-value gate in the repo
# ---------------------------------------------------------------------------
[tool.importlinter]
include_external_packages = true
root_packages = [
    "mff_contracts",
    "mff_vision",
    "mff_docmodel",
    "mff_manifest",
    "mff_applier",
    "mff_store",
    "mff_fakes",
    "email_service",
    "editor_service",
    "vision_stub",
    "cv",
]

[[tool.importlinter.contracts]]
name = "services depend on packages depend on mff_contracts, never sideways or upward"
type = "layers"
layers = [
    "email_service | editor_service | vision_stub | cv",
    "mff_vision | mff_docmodel | mff_manifest | mff_applier | mff_store | mff_fakes",
    "mff_contracts",
]

[[tool.importlinter.contracts]]
name = "mff_contracts depends on pydantic and nothing else"
type = "forbidden"
source_modules = ["mff_contracts"]
forbidden_modules = [
    "google",
    "pydantic_ai",
    "httpx",
    "docx",
    "yaml",
    "fastapi",
    "starlette",
    "PIL",
    "mff_vision",
    "mff_docmodel",
    "mff_manifest",
    "mff_applier",
    "mff_store",
    "mff_fakes",
    "email_service",
    "editor_service",
    "vision_stub",
    "cv",
]

[[tool.importlinter.contracts]]
name = "no module outside llm/ and agents/ imports a model library"
type = "forbidden"
source_modules = [
    "mff_contracts",
    "mff_vision",
    "mff_docmodel",
    "mff_manifest",
    "mff_applier",
    "mff_store",
    "email_service",
    "editor_service",
    "vision_stub",
]
# `mff_fakes` is deliberately NOT in `source_modules` above: its one job (the ADK test
# double, B15) is to subclass `google.adk.models.BaseLlm` directly, so it must import
# `google.adk` and `google.genai.types` to exist at all. It is the same kind of
# blessed, singular exception as the vision service below -- excluded from this
# contract's source list rather than given an `ignore_imports` entry, matching this
# repo's own precedent for "the one package whose entire purpose is the forbidden
# import." It stays safe because it is a dev-group-only dependency (see its
# pyproject.toml): no service image, and therefore no runtime import graph, ever
# contains it.
# `google` covers both `google.adk` (the agent framework) and `google.genai` (the model
# SDK underneath it). `pydantic_ai` stays on this list even though we no longer use it:
# `pydantic-evals` pins `pydantic-ai-slim`, so the module is importable in the dev
# environment and only this contract stops it drifting back into runtime source.
forbidden_modules = ["pydantic_ai", "anthropic", "openai", "google", "vertexai", "litellm"]
# NOTE: this repo has no `llm/` or `agents/` subpackages yet (out of scope for B0).
# When a branch introduces one, exempt it here with `ignore_imports`, e.g.:
#   ignore_imports = ["editor_service.agents.reviewer -> google.adk"]
# rather than removing this contract.
#
# VISION IS EXEMPT FROM THE ADK DECISION. ADK is the editor's choice, not a repo-wide
# mandate. The vision service is separately owned (see AGENTS.md, req 13) and MAY use
# Pydantic AI or any other framework -- it sits behind an HTTP contract and what runs on
# the far side is its owner's call. `vision_stub` is listed above only because today's
# placeholder calls no model at all. When the real service lands and imports one, give it
# an `ignore_imports` entry or drop it from `source_modules`; do NOT strip its dependency
# to match the editor, and do not report it as drift.
#
# B12: banning "google" also bans `google.cloud.firestore` / `google.cloud.storage` /
# `google.auth`, which are not model libraries and are exactly what mff-store needs to
# talk to Firestore and GCS. Two things about this tool matter here:
#   1. The "forbidden" contract rejects a dotted external module (e.g.
#      "google.generativeai") outright -- "subpackages of external packages are not
#      valid" -- so narrowing the ban to just the Gemini/Vertex modules is not an
#      option it supports.
#   2. Because "google" is not itself one of this project's `root_packages`,
#      `include_external_packages` collapses every import of it down to the top-level
#      "google" module regardless of which submodule was actually imported -- so the
#      exemption below has to target "google", not "google.cloud.firestore" /
#      "google.cloud.storage" / "google.auth.credentials" (which is what the actual
#      import statements name, and what a narrower, matching ignore would look like if
#      grimp tracked external submodules by default).
#
# B8: editor_service.llm is exactly the `llm/` subpackage this contract's own NOTE
# (above) anticipated -- it is the one place in the service allowed to import
# google.adk / google.genai (LlmAgent, App, Gemini, Runner, InMemorySessionService,
# BasePlugin, types.HttpRetryOptions). `editor_service.api.*` do NOT get an exemption:
# they depend on the *result* of building an agent (via the SliceRunner callable
# in api/deps.py), never on google.adk directly, and /healthz (api.routers.health,
# settings.py) must stay import-clean of it entirely -- see the brief, DoD 7.
ignore_imports = [
    "mff_store.firestore_store -> google",
    "mff_store.gcs -> google",
    "editor_service.llm.agent -> google",
    "editor_service.llm.deps -> google",
    "editor_service.llm.model -> google",
    "editor_service.llm.plugins -> google",
    "editor_service.llm.run -> google",
]

# ---------------------------------------------------------------------------
# coverage — per-package, not global (see Makefile). Protocol method bodies
# (`...`, no implementation to exercise — B0 defines shapes, not adapters) are
# excluded; everything else must be exercised by a real test.
# ---------------------------------------------------------------------------
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "^\\s*\\.\\.\\.\\s*$",
]

