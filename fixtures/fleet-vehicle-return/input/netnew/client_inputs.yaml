# Net-new mode: the same manifest, no document supplied.
# The client sends structured inputs and the editor composes the report.
#
# Deliberately the SAME underlying submission as the derivative case, so the two
# modes can be compared directly on identical material. The same two defects are
# therefore present — R-01 short by one photo, R-04 shot from the wrong position.
# Net-new does not get to hide them: it records how each requirement was realised,
# and a requirement it cannot realise from the inputs comes back unverified.

vehicle:
  make_model: "Nissan Qashqai"
  registration: "WN 7020U"
  odometer_km: 59650
  return_date: "2026-08-30"
  handed_over_by: null          # left blank by the client on purpose

notes: >
  Pojazd zwrócony w stanie ogólnym dobrym. Na desce rozdzielczej widoczny
  komunikat o awarii skrzyni biegów. Zdjęcia wykonane na stacji paliw.

# Photos as the client labelled them — their words, not our taxonomy.
# Mapping these loose labels onto R-01..R-10 is part of the net-new work.
