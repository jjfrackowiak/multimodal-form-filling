# What the composed document must contain, independent of wording. This is the
# structural gate for net-new; the LLMJudge rubric handles quality on top of it.
expected_output_structure:
  must_contain_sections_for: [R-01, R-02, R-03, R-04, R-05, R-06, R-07, R-08, R-09, R-10]
  must_embed_distinct_images: 15
  must_carry_vehicle_identifiers: [make_model, registration, odometer_km, return_date]
  every_section_carries_a_comment: true    # req 10: how the requirement was realised
  expected_unverified: []                  # nothing should exhaust its retries here
  expected_shortfalls:
    - requirement_id: R-01
      reason: "Only one engine-bay photograph available in the inputs; two required."
    - requirement_id: R-04
      reason: "Only one of the two headliner photographs is shot from between the front seats."
